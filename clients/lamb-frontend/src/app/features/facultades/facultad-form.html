<h2>{{ idFacultad ? 'Editar facultad' : 'Nueva facultad' }}</h2>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<form class="formulario" [formGroup]="form" (ngSubmit)="guardar()">
  <div>
    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" formControlName="nombre" />
  </div>

  <div>
    <label for="decano">Decano</label>
    <input id="decano" type="text" formControlName="decano" />
  </div>

  <div class="acciones">
    <button type="submit" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Guardar' }}</button>
    <a routerLink="/facultades">Cancelar</a>
  </div>
</form>
