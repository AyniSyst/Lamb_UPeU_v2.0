<h2>Cursos</h2>
<p>Catalogo de cursos (copia de solo lectura, sincronizada desde curriculo).</p>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Codigo</th>
      <th>Nombre</th>
      <th>Creditos</th>
    </tr>
  </thead>
  <tbody>
    @for (curso of cursos(); track curso.id) {
      <tr>
        <td>{{ curso.id }}</td>
        <td>{{ curso.codigo }}</td>
        <td>{{ curso.nombre }}</td>
        <td>{{ curso.creditos }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">No hay cursos registrados.</td>
      </tr>
    }
  </tbody>
</table>
