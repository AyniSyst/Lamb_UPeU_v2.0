<h2>Nuevo pago</h2>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div>
    <label for="idPersona">ID Persona</label>
    <input id="idPersona" type="number" formControlName="idPersona" />
  </div>

  <div>
    <label for="concepto">Concepto</label>
    <input id="concepto" type="text" formControlName="concepto" />
  </div>

  <div>
    <label for="monto">Monto</label>
    <input id="monto" type="number" step="0.01" formControlName="monto" />
  </div>

  <div>
    <label for="metodo">Metodo</label>
    <select id="metodo" formControlName="metodo">
      <option value="">Seleccione...</option>
      @for (m of metodos; track m) {
        <option [value]="m">{{ m }}</option>
      }
    </select>
  </div>

  <button type="submit" [disabled]="enviando()">Procesar</button>
</form>
