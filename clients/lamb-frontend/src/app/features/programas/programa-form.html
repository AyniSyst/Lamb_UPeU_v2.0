<h2>{{ idPrograma ? 'Editar programa' : 'Nuevo programa' }}</h2>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<form class="formulario" [formGroup]="form" (ngSubmit)="guardar()">
  <div>
    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" formControlName="nombre" />
  </div>

  <div>
    <label for="gradoAcademico">Grado academico</label>
    <select id="gradoAcademico" formControlName="gradoAcademico">
      @for (grado of grados; track grado) {
        <option [value]="grado">{{ grado }}</option>
      }
    </select>
  </div>

  <div>
    <label for="duracionSemestres">Duracion (semestres)</label>
    <input id="duracionSemestres" type="number" min="1" max="20" formControlName="duracionSemestres" />
  </div>

  <div>
    <label for="facultadId">Facultad</label>
    <select id="facultadId" formControlName="facultadId">
      <option [ngValue]="null" disabled>Selecciona una facultad</option>
      @for (facultad of facultades(); track facultad.id) {
        <option [ngValue]="facultad.id">{{ facultad.nombre }}</option>
      }
    </select>
    @if (!facultades().length) {
      <small class="ayuda">Primero registra una facultad.</small>
    }
  </div>

  <div class="acciones">
    <button type="submit" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Guardar' }}</button>
    <a routerLink="/programas">Cancelar</a>
  </div>
</form>
