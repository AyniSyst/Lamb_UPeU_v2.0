<h2>{{ idPlan ? 'Editar plan de estudio' : 'Nuevo plan de estudio' }}</h2>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<form class="formulario" [formGroup]="form" (ngSubmit)="guardar()">
  <div>
    <label for="idPrograma">Programa</label>
    <select id="idPrograma" formControlName="idPrograma">
      <option [ngValue]="null" disabled>Selecciona un programa</option>
      @for (p of programas(); track p.id) {
        <option [ngValue]="p.id">{{ p.nombre }} ({{ p.gradoAcademico }})</option>
      }
    </select>
  </div>

  <div>
    <label for="version">Version</label>
    <input id="version" type="text" formControlName="version" placeholder="2026" />
  </div>

  <div>
    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" formControlName="nombre" placeholder="Plan de estudios 2026" />
  </div>

  <div class="acciones">
    <button type="submit" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Guardar y cargar cursos' }}</button>
    <a routerLink="/planes-estudio">Cancelar</a>
  </div>
</form>
