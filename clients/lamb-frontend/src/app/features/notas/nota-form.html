<h2>Nueva nota</h2>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div>
    <label for="idPersona">ID Persona</label>
    <input id="idPersona" type="number" formControlName="idPersona" />
  </div>

  <div>
    <label for="idGrupo">ID Grupo</label>
    <input id="idGrupo" type="number" formControlName="idGrupo" />
  </div>

  <div>
    <label for="idComponente">ID Componente</label>
    <input id="idComponente" type="number" formControlName="idComponente" />
  </div>

  <div>
    <label for="calificacion">Calificacion (0-20)</label>
    <input id="calificacion" type="number" min="0" max="20" step="0.1" formControlName="calificacion" />
  </div>

  <div>
    <label for="periodo">Periodo</label>
    <input id="periodo" type="text" formControlName="periodo" placeholder="2026-I" />
  </div>

  <button type="submit" [disabled]="enviando()">Registrar</button>
</form>
