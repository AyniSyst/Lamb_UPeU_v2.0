<div class="shell">
  <header class="header">
    <strong>Lamb UPeU · Admision</strong>
    <div class="sesion-area">
      @if (auth.autenticado()) {
        <span>{{ auth.nombreUsuario() }}</span>
        <button type="button" (click)="auth.cerrarSesion()">Cerrar sesion</button>
      } @else {
        <button type="button" (click)="iniciarLogin()">Iniciar sesion</button>
      }
    </div>
  </header>

  <nav class="sidebar">
    <a routerLink="/" routerLinkActive="active">Inicio</a>
    <a routerLink="/postulaciones" routerLinkActive="active">Postulaciones</a>
    <a routerLink="/postulaciones/nueva" routerLinkActive="active">Nueva postulacion</a>
    <a routerLink="/mi-trayectoria" routerLinkActive="active">Mi trayectoria</a>
    <a routerLink="/personas" routerLinkActive="active">Personas</a>
    <a routerLink="/facultades" routerLinkActive="active">Facultades</a>
    <a routerLink="/programas" routerLinkActive="active">Programas</a>
    <a routerLink="/cursos" routerLinkActive="active">Cursos</a>
    <a routerLink="/secciones" routerLinkActive="active">Secciones</a>
    <a routerLink="/planes-estudio" routerLinkActive="active">Planes de estudio</a>
    <a routerLink="/matriculas" routerLinkActive="active">Matriculas</a>
    <a routerLink="/notas" routerLinkActive="active">Notas</a>
    <a routerLink="/actas" routerLinkActive="active">Actas</a>
    <a routerLink="/pagos" routerLinkActive="active">Pagos</a>
  </nav>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
