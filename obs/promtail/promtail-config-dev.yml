server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://lamb-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: lamb-personas-ms
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[.,]\d{3})'
      - replace:
          source: ts
          expression: '(,)'
          replace: '.'
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05.000'
          location: America/Lima
    static_configs:
      - targets: [localhost]
        labels:
          application: lamb-personas-ms
          __path__: /var/log/lamb/lamb-personas-ms/logs/*.log

