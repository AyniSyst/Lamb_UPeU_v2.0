name: lamb-planificacion-prod

services:
  postgres-planificacion:
    image: postgres:16-alpine
    container_name: lamb-postgres-planificacion
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - lamb_planificacion_data:/var/lib/postgresql/data
    ports:
      - "25453:5432"
    networks:
      - lamb-planificacion-int

  lamb-planificacion-ms:
    build: .
    restart: unless-stopped
    depends_on:
      postgres-planificacion:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DB_HOST: lamb-postgres-planificacion
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./logs:/app/logs
    networks:
      - lamb-planificacion-int
      - lamb-prod-net

volumes:
  lamb_planificacion_data:

networks:
  lamb-planificacion-int:
    name: lamb-planificacion-int
  lamb-prod-net:
    external: true
